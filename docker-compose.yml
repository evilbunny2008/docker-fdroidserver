services:
  fdroid:
    image: ghcr.io/evilbunny2008/fdroidserver:latest
    container_name: fdroidserver
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: Australia/Sydney
      HOME: /fdroid
      FDROID_REPO_ICON: fdroid.png
      FDROID_UPDATE_INTERVAL: 24h
      FDROID_REPO_URL: https://example.com/fdroid/repo # Change me
      FDROID_REPO_NAME: F-Droid App Store
      FDROID_REPO_DESCRIPTION: An app store for Android devices.
    volumes:
      - ./fdroid:/fdroid
      - ./updates:/updates:ro
    expose:
      - 8080
    networks:
      - frontend
networks:
  frontend:
